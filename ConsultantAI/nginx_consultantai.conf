# ============================================================
# ConsultantAI — Nginx 反向代理配置
# 粘贴到宝塔：网站 → 选择站点 → 配置文件
# 或：网站 → 反向代理 → 添加反向代理（填 http://127.0.0.1:8000）
# ============================================================

server {
    listen 80;
    server_name api.d2cgo.com;   # 改为你的域名或 IP

    # 日志
    access_log  /www/wwwlogs/consultantai.access.log;
    error_log   /www/wwwlogs/consultantai.error.log;

    # ── 反向代理到 FastAPI ──────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 必须透传这两个头，SwiftUI 客户端鉴权依赖它们
        proxy_set_header   X-Auth-Token  $http_x_auth_token;
        proxy_set_header   Host          $host;
        proxy_set_header   X-Real-IP     $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 流式响应（聊天接口）必须关缓冲
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # CORS（宝塔不自带时用这段）
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Headers "Content-Type, X-Auth-Token" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}
