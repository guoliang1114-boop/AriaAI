name: manage_project_folders
purpose: Manage project-space folders and file placement.
when_to_use: Use to list folders, create folders, rename folders, move files between folders, or delete empty folders when explicitly requested.
when_not_to_use: Do not delete non-empty folders. Do not move or rename files unless the user clearly requested file organization.
ui_effect: Changes project-space organization and refreshes project memory.
required_policy:
  default: write_artifact
  list: read_only_tool
  create: write_artifact
  rename: modify_existing_file
  move_file: modify_existing_file
  delete: destructive_action
