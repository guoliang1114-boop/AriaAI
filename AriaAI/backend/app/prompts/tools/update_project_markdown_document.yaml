name: update_project_markdown_document
purpose: Create, append to, or replace a Markdown document in the current project space.
when_to_use: Use only when the user explicitly asks to create, save, export, append, replace, or modify Markdown content.
when_not_to_use: Do not use for analysis-only answers, summaries that were not requested as files, or speculative drafts that the user has not asked to save.
ui_effect: Creates or updates a project-space artifact that should appear in chat and in the Space page.
required_policy:
  default: write_artifact
  create: write_artifact
  append: modify_existing_file
  replace: modify_existing_file
