name: Production Database E2E

on:
  workflow_dispatch:

concurrency:
  # Shared with deploy and restore workflows so the live database cannot be
  # migrated, restarted, or restored while this isolated test schema is active.
  group: production-database-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Backup and test production PostgreSQL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          # The PostgreSQL suite currently takes about 25 minutes on the
          # production host. Keep enough headroom for the verified backup,
          # public-schema postflight, and abandoned-schema cleanup.
          command_timeout: 35m
          script: |
            set -eu

            PROJECT_DIR="/www/wwwroot/AriaAI"
            BACKEND_DIR="$PROJECT_DIR/backend"
            BACKUP_DIR="/www/backups/ariaai"
            RUN_TAG="${{ github.run_id }}_${{ github.run_attempt }}"
            DB_TEST_WORKER="prod_${RUN_TAG}"
            TEST_SCHEMA="ariaai_test_${DB_TEST_WORKER}"

            cd "$BACKEND_DIR"
            PYTHON=".venv/bin/python3"
            if [ ! -x "$PYTHON" ]; then
              PYTHON=".venv/bin/python"
            fi
            if [ ! -x "$PYTHON" ]; then
              echo "No Python interpreter found in backend virtual environment." >&2
              exit 127
            fi

            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            BACKUP_PATH="$BACKUP_DIR/ariaai_pre_e2e_$(date -u +%Y%m%dT%H%M%SZ)_${RUN_TAG}.dump"
            export BACKUP_PATH DB_TEST_WORKER TEST_SCHEMA

            # The maintenance concurrency group guarantees no other production
            # E2E is active. Remove only abandoned schemas minted by an earlier
            # timed-out production E2E before taking the next backup.
            "$PYTHON" - <<'PY'
            import re

            from sqlalchemy import create_engine, text

            from app.config import DATABASE_URL

            safe_pattern = re.compile(r"ariaai_test_prod_[0-9]+_[0-9]+\Z")
            engine = create_engine(DATABASE_URL)
            try:
                with engine.begin() as connection:
                    candidates = list(
                        connection.execute(
                            text(
                                "SELECT schema_name FROM information_schema.schemata "
                                "WHERE schema_name LIKE 'ariaai_test_prod_%' "
                                "ORDER BY schema_name"
                            )
                        ).scalars()
                    )
                    for schema_name in candidates:
                        if not safe_pattern.fullmatch(str(schema_name)):
                            raise SystemExit(
                                f"Refusing unexpected production E2E schema: {schema_name!r}"
                            )
                        connection.exec_driver_sql(
                            f'DROP SCHEMA IF EXISTS "{schema_name}" CASCADE'
                        )
                        print(
                            "Removed abandoned production E2E schema: "
                            f"schema={schema_name}"
                        )
            finally:
                engine.dispose()
            PY

            # Create a full custom-format backup before any test schema exists.
            # DATABASE_URL is loaded inside Python so credentials never enter the
            # workflow command output or a temporary shell file.
            "$PYTHON" - <<'PY'
            import glob
            import hashlib
            import os
            import re
            import shutil
            import subprocess
            from pathlib import Path

            from sqlalchemy import create_engine, text
            from sqlalchemy.engine import make_url

            from app.config import DATABASE_URL

            backup_path = Path(os.environ["BACKUP_PATH"])
            backup_dir = backup_path.parent
            for stale_path in backup_dir.glob("ariaai_pre_e2e_*.dump"):
                if stale_path.is_file() and stale_path.stat().st_size == 0:
                    stale_path.unlink()
                    print(f"Removed invalid empty backup: path={stale_path}")

            engine = create_engine(DATABASE_URL)
            try:
                with engine.connect() as connection:
                    server_version_num = int(
                        connection.execute(text("SHOW server_version_num")).scalar_one()
                    )
            finally:
                engine.dispose()
            server_major = server_version_num // 10000

            candidate_paths = set(
                glob.glob("/usr/lib/postgresql/*/bin/pg_dump")
                + glob.glob("/usr/pgsql-*/bin/pg_dump")
                + glob.glob("/www/server/pgsql*/bin/pg_dump")
                + glob.glob("/www/server/pgsql/*/bin/pg_dump")
                + glob.glob("/opt/pgsql*/bin/pg_dump")
            )
            default_pg_dump = shutil.which("pg_dump")
            if default_pg_dump:
                candidate_paths.add(default_pg_dump)
            for process_exe in glob.glob("/proc/[0-9]*/exe"):
                try:
                    resolved = Path(process_exe).resolve()
                except OSError:
                    continue
                if resolved.name.startswith("postgres"):
                    candidate_paths.add(str(resolved.parent / "pg_dump"))

            compatible_clients = []
            discovered_versions = []
            for candidate in sorted(candidate_paths):
                if not os.path.isfile(candidate) or not os.access(candidate, os.X_OK):
                    continue
                version_result = subprocess.run(
                    [candidate, "--version"],
                    check=False,
                    capture_output=True,
                    text=True,
                )
                version_text = (version_result.stdout or version_result.stderr).strip()
                match = re.search(r"(\d+)(?:\.\d+)?", version_text)
                if not match:
                    continue
                client_major = int(match.group(1))
                discovered_versions.append(f"{candidate}:{client_major}")
                if client_major >= server_major:
                    compatible_clients.append((client_major, candidate))

            database_url = make_url(DATABASE_URL)
            client_env = os.environ.copy()
            if database_url.password:
                client_env["PGPASSWORD"] = database_url.password

            connection_args = []
            if database_url.host:
                connection_args.extend(["--host", database_url.host])
            if database_url.port:
                connection_args.extend(["--port", str(database_url.port)])
            if database_url.username:
                connection_args.extend(["--username", database_url.username])
            if database_url.database:
                connection_args.extend(["--dbname", database_url.database])

            try:
                if compatible_clients:
                    client_major, pg_dump = sorted(compatible_clients)[-1]
                    pg_restore = str(Path(pg_dump).with_name("pg_restore"))
                    if not os.path.isfile(pg_restore):
                        raise SystemExit(f"Matching pg_restore not found beside {pg_dump}")
                    subprocess.run(
                        [
                            pg_dump,
                            *connection_args,
                            "--format=custom",
                            "--no-owner",
                            "--no-acl",
                            "--file",
                            str(backup_path),
                        ],
                        env=client_env,
                        check=True,
                    )
                    subprocess.run(
                        [pg_restore, "--list", str(backup_path)],
                        check=True,
                        stdout=subprocess.DEVNULL,
                    )
                    backup_client = f"local:{pg_dump}:v{client_major}"
                else:
                    docker = shutil.which("docker")
                    if not docker:
                        raise SystemExit(
                            "No PostgreSQL client compatible with server "
                            f"v{server_major}; discovered={discovered_versions}"
                        )
                    docker_env_args = ["--env", "PGPASSWORD"] if database_url.password else []
                    image = f"postgres:{server_major}"
                    with backup_path.open("wb") as backup_file:
                        subprocess.run(
                            [
                                docker,
                                "run",
                                "--rm",
                                "--network",
                                "host",
                                *docker_env_args,
                                image,
                                "pg_dump",
                                *connection_args,
                                "--format=custom",
                                "--no-owner",
                                "--no-acl",
                            ],
                            env=client_env,
                            check=True,
                            stdout=backup_file,
                        )
                    with backup_path.open("rb") as backup_file:
                        subprocess.run(
                            [docker, "run", "--rm", "-i", image, "pg_restore", "--list"],
                            check=True,
                            stdin=backup_file,
                            stdout=subprocess.DEVNULL,
                        )
                    backup_client = f"docker:{image}"

                os.chmod(backup_path, 0o600)
                digest_builder = hashlib.sha256()
                with backup_path.open("rb") as backup_file:
                    for chunk in iter(lambda: backup_file.read(1024 * 1024), b""):
                        digest_builder.update(chunk)
                digest = digest_builder.hexdigest()
                print(
                    "Production backup verified: "
                    f"path={backup_path}, bytes={backup_path.stat().st_size}, "
                    f"sha256={digest}, server_major={server_major}, "
                    f"client={backup_client}"
                )
            except BaseException:
                backup_path.unlink(missing_ok=True)
                raise
            PY

            # Run PostgreSQL-backed chat tests inside one uniquely named schema.
            # The wrapper always removes that exact schema, including when pytest
            # fails, and verifies that the public schema signature did not change.
            "$PYTHON" - <<'PY'
            import os
            import re
            import subprocess
            import sys

            from sqlalchemy import create_engine, text
            from sqlalchemy.engine import make_url

            from app.config import DATABASE_URL

            worker = os.environ["DB_TEST_WORKER"]
            test_schema = os.environ["TEST_SCHEMA"]
            expected_schema = f"ariaai_test_{worker}"
            if test_schema != expected_schema or not re.fullmatch(
                r"ariaai_test_[A-Za-z0-9_]+", test_schema
            ):
                raise SystemExit(f"Unsafe test schema name: {test_schema!r}")

            engine = create_engine(DATABASE_URL)

            def public_signature():
                with engine.connect() as connection:
                    database_name, database_user = connection.execute(
                        text("SELECT current_database(), current_user")
                    ).one()
                    tables = tuple(
                        connection.execute(
                            text(
                                "SELECT table_name FROM information_schema.tables "
                                "WHERE table_schema = 'public' ORDER BY table_name"
                            )
                        ).scalars()
                    )
                    revisions = tuple(
                        connection.execute(
                            text(
                                "SELECT version_num FROM public.alembic_version "
                                "ORDER BY version_num"
                            )
                        ).scalars()
                    ) if "alembic_version" in tables else (
                        "__missing_alembic_version__",
                    )
                return database_name, database_user, tables, revisions

            before = public_signature()
            print(
                "Production database preflight: "
                f"database={before[0]}, user={before[1]}, "
                f"public_tables={len(before[2])}, revisions={list(before[3])}, "
                f"test_schema={test_schema}"
            )

            # Create the isolated schema before importing the application in the
            # pytest process. Its global DATABASE_URL is restricted to only that
            # schema, so even code paths that do not accept an injected test
            # engine cannot fall through to public application tables.
            result = None
            try:
                with engine.begin() as connection:
                    connection.execute(text(f'CREATE SCHEMA "{test_schema}"'))
                base_url = make_url(DATABASE_URL)
                isolated_url = base_url.set(
                    query={
                        **dict(base_url.query),
                        "options": f"-csearch_path={test_schema}",
                    }
                )

                isolated_database_url = isolated_url.render_as_string(
                    hide_password=False
                )
                env = os.environ.copy()
                # Restrict both database entry points. Most tests use
                # TEST_DATABASE_URL while application globals use DATABASE_URL;
                # leaving either one on the production default would permit an
                # accidental unqualified write to public.
                env["TEST_DATABASE_URL"] = isolated_database_url
                env["DATABASE_URL"] = isolated_database_url
                env["PYTEST_XDIST_WORKER"] = worker
                result = subprocess.run(
                    [
                        sys.executable,
                        "-m",
                        "pytest",
                        "-q",
                        "tests/test_auth_router.py",
                        "tests/test_artifacts.py",
                        "tests/test_artifact_verification.py",
                        "tests/test_artifact_verification_migration.py",
                        "tests/test_artifact_acceptance.py",
                        "tests/test_artifact_acceptance_migration.py",
                        "tests/test_generated_file_deliverable_migration.py",
                        "tests/test_artifact_knowledge_archive_migration.py",
                        "tests/test_active_chat_run_lease.py",
                        "tests/test_active_chat_run_lease_migration.py",
                        "tests/test_active_chat_run_lease_postgres.py",
                        "tests/test_agent_loop_durable_boundaries.py",
                        "tests/test_chat_end_to_end.py",
                        "tests/test_chat_streaming.py",
                        "tests/test_chat_runtime_configuration.py",
                        "tests/test_conversation_continuity.py",
                        "tests/test_conversation_continuity_postgres.py",
                        "tests/test_project_question_resolutions.py",
                        "tests/test_project_question_resolution_migration.py",
                        "tests/test_project_question_workbench.py",
                        "tests/test_project_question_workbench_migration.py",
                        "tests/test_project_question_reanswer.py",
                        "tests/test_project_question_remediation_promotions.py",
                        "tests/test_project_question_remediation_promotion_migration.py",
                        "tests/test_project_question_remediation_promotions_postgres.py",
                        "tests/test_project_question_remediation_executions.py",
                        "tests/test_project_question_remediation_execution_migration.py",
                        "tests/test_project_question_remediation_executions_postgres.py",
                        "tests/test_project_question_resolutions_postgres.py",
                        "tests/test_chat_flow.py::ChatStreamingServiceTestCase::test_prepare_chat_runtime_builds_capsule_and_instruction_manifest",
                        "tests/test_chat_flow.py::ChatStreamingServiceTestCase::test_build_chat_context_client_scope_injects_client_memory_when_available",
                        "tests/test_chat_flow.py::ChatStreamingServiceTestCase::test_build_chat_context_client_scope_without_matching_client_record_falls_back_to_project_scope",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_project_memory_status_and_rebuild_flow",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_project_memory_batch_rebuild_only_updates_requested_projects",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_project_memory_batch_rebuild_can_generate_missing_memory",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_memory_rebuild_persists_rebuild_log_and_coverage",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_archiving_project_auto_promotes_memory_to_client",
                        "tests/test_chat_flow.py::ProjectConversationArchiveTestCase::test_delete_project_cascades_related_records",
                        "tests/test_chat_flow.py::ClientMemoryRouterTestCase::test_client_memory_rebuild_flow",
                        "tests/test_chat_flow.py::ClientMemoryRouterTestCase::test_promote_project_memory_to_client",
                        "tests/test_chat_flow.py::ClientMemoryRouterTestCase::test_client_memory_batch_rebuild_updates_requested_clients",
                        "tests/test_chat_flow.py::ClientMemoryRouterTestCase::test_run_client_memory_jobs_now_rebuilds_client",
                        "tests/test_conversation_state_and_versions.py",
                        "tests/test_knowledge.py",
                        "tests/test_knowledge_job_acl.py",
                        "tests/test_knowledge_job_recovery.py",
                        "tests/test_knowledge_storage_atomicity.py",
                        "tests/test_knowledge_legacy_migration.py",
                        "tests/test_layered_memory_routing.py",
                        "tests/test_client_memory_acl.py",
                        "tests/test_client_memory_jobs.py",
                        "tests/test_clients_router.py::ClientsCrudTestCase::test_update_client",
                        "tests/test_clients_router.py::ClientsCrudTestCase::test_delete_client_removes_all_owned_memory_and_stakeholder_records",
                        "tests/test_clients_router.py::ClientsStakeholderTestCase::test_delete_stakeholder",
                        "tests/test_clients_router.py::ClientAuthorizationTestCase::test_single_project_editor_cannot_rename_or_delete_shared_client",
                        "tests/test_clients_router.py::ClientAuthorizationTestCase::test_editor_of_every_linked_project_can_rename_and_delete_client",
                        "tests/test_clients_router.py::ClientAuthorizationTestCase::test_client_views_do_not_expose_other_linked_projects_or_documents",
                        "tests/test_memory_candidates.py",
                        "tests/test_memory_fact_source_trust.py",
                        "tests/test_memory_failure_recovery.py",
                        "tests/test_memory_source_attributions.py",
                        "tests/test_memory_source_fingerprints.py",
                        "tests/test_memory_slots.py",
                        "tests/test_memory_slot_normalization_migration.py",
                        "tests/test_memory_operation_state.py",
                        "tests/test_memory_operation_state_migration.py",
                        "tests/test_memory_legacy_quarantine.py",
                        "tests/test_memory_legacy_quarantine_migration.py",
                        "tests/test_knowledge_v005_api.py",
                        "tests/test_knowledge_v005_models.py",
                        "tests/test_knowledge_v005_permissions.py",
                        "tests/test_knowledge_write_permissions.py",
                        "tests/test_project_client_identity.py",
                        "tests/test_project_client_identity_migration.py",
                        "tests/test_project_deletion.py",
                        "tests/test_project_memory_acl.py",
                        "tests/test_project_stakeholder_acl.py",
                        "tests/test_project_subroute_write_acl.py",
                        "tests/test_rag.py",
                        "tests/test_route_registration.py",
                        "tests/test_durable_run_inputs.py",
                        "tests/test_durable_run_recovery_migration.py",
                        "tests/test_run_effect_record.py",
                        "tests/test_run_outputs_postgres.py",
                        "tests/test_run_rollout.py",
                        "tests/test_task_orchestrator.py",
                        "tests/test_tool_executor_recovery.py",
                        "tests/test_office_documents_tool.py",
                        "tests/test_hitas_project_write_final_auth.py",
                        "tests/test_hitas_project_scope_binding.py",
                        "tests/test_chat_actions.py",
                        "tests/test_chat_async_recovery.py",
                        "tests/test_chat_flow.py::ChatStreamingServiceTestCase::test_stream_chat_events_persists_friendly_phase_errors",
                        "tests/test_sse_events.py",
                        "tests/test_turn_recovery.py",
                        "tests/test_skills_router.py",
                        "tests/test_skill_deliverables.py",
                        "tests/test_skill_runtime_contract.py",
                        "tests/test_user_memory_prompt.py::FormatUserMemoryTest",
                    ],
                    env=env,
                    check=False,
                )
            finally:
                with engine.begin() as connection:
                    connection.execute(
                        text(f'DROP SCHEMA IF EXISTS "{test_schema}" CASCADE')
                    )

            after = public_signature()
            with engine.connect() as connection:
                schema_remaining = connection.execute(
                    text(
                        "SELECT EXISTS (SELECT 1 FROM information_schema.schemata "
                        "WHERE schema_name = :schema_name)"
                    ),
                    {"schema_name": test_schema},
                ).scalar_one()
            engine.dispose()

            if before != after:
                raise SystemExit("Public schema signature changed during isolated E2E tests")
            if schema_remaining:
                raise SystemExit(f"Test schema cleanup failed: {test_schema}")
            print(
                "Production database postflight passed: "
                f"public_tables={len(after[2])}, revisions={list(after[3])}, "
                "test_schema_removed=true"
            )
            if result is None or result.returncode != 0:
                raise SystemExit(result.returncode if result is not None else 1)
            PY

            "$PYTHON" scripts/memory_read_authority_report.py
            curl -fsS --max-time 10 http://127.0.0.1:8000/health >/dev/null
            echo "Production database E2E completed successfully."
