name: Knowledge Semantic Eval

on:
  workflow_dispatch:

concurrency:
  group: production-database-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  semantic-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Evaluate deployed semantic retrieval without business writes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -eu
            cd /www/wwwroot/AriaAI/backend
            PYTHON=".venv/bin/python3"
            if [ ! -x "$PYTHON" ]; then
              PYTHON=".venv/bin/python"
            fi
            # Hashes identify deployed files; the server checkout is not the
            # runtime version. Never print configuration, credentials, or text.
            "$PYTHON" - <<'PY'
            import hashlib
            import json
            from pathlib import Path

            files = [
                "scripts/knowledge_retrieval_eval.py",
                "scripts/knowledge_embedding_capacity.py",
                "app/services/knowledge_embeddings.py",
                "app/services/knowledge_retrieval.py",
            ]
            print(json.dumps({"deployed_file_sha256": {
                name: hashlib.sha256(Path(name).read_bytes()).hexdigest()
                for name in files
            }}))
            PY
            # The evaluator uses synthetic fixtures in an ephemeral SQLite DB.
            # Model cache files are the only persistent writes. Provider config
            # and business indexes remain unchanged.
            "$PYTHON" scripts/knowledge_retrieval_eval.py --semantic --enforce
            "$PYTHON" scripts/knowledge_read_authority_report.py
            # Separate process: full app import, model load and 150 synthetic
            # passages. Reports memory/timing numbers only, never text.
            "$PYTHON" scripts/knowledge_embedding_capacity.py --passages 150 --batch-size 32
            # Report only process metrics; PM2's full environment is private.
            "$PYTHON" - <<'PY'
            import json
            from scripts.knowledge_provider_switch import _process

            process = _process()
            env = process.get("pm2_env", {})
            print(json.dumps({"backend_process": {
                "pid": process["pid"],
                "status": env.get("status"),
                "rss_bytes": process.get("monit", {}).get("memory"),
                "restart_count": env.get("restart_time"),
                "memory_restart_bytes": env.get("max_memory_restart"),
            }}))
            PY
