name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Support manual runs

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aria-web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Frontend
        run: |
          cd aria-web
          npm ci
          npm run build

      - name: Prepare Backend
        run: |
          cd AriaAI/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "aria-web/dist/,AriaAI/backend/"
          target: "/www/wwwroot/AriaAI/"
          strip_components: 0
          overwrite: true

      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            set -e
            cd /www/wwwroot/AriaAI/AriaAI/backend

            # Activate the backend virtual environment.
            source .venv/bin/activate

            # Install backend dependencies in case requirements changed.
            pip install -r requirements.txt

            # Normalize historical migration state before applying the latest schema.
            python3 scripts/ensure_db.py
            alembic upgrade head

            # Reload backend after code and schema changes.
            pm2 reload ariaai-backend --update-env

            # Replace frontend build artifacts served by Nginx.
            rm -rf /www/wwwroot/aria.d2cgo.co/*
            cp -r /www/wwwroot/AriaAI/aria-web/dist/* /www/wwwroot/aria.d2cgo.co/

            # Reload Nginx only after the config validates.
            nginx -t && nginx -s reload

            echo "Deployment completed successfully."

      - name: Notify Success
        if: success()
        run: echo "Deployment succeeded."

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed."
