name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 支持手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: aria-web/package-lock.json
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Build Frontend
        run: |
          cd aria-web
          npm ci
          npm run build
          
      - name: Prepare Backend
        run: |
          cd AriaAI/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "aria-web/dist/,AriaAI/backend/"
          target: "/www/wwwroot/AriaAI/"
          strip_components: 0
          overwrite: true
          
      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            cd /www/wwwroot/AriaAI/AriaAI/backend
            
            # 激活虚拟环境
            source .venv/bin/activate
            
            # 安装依赖（如果有新增）
            pip install -r requirements.txt
            
            # 修复数据库迁移状态并升级
            python3 -c "
import os
os.environ.setdefault('PYTHONIOENCODING', 'utf-8')
from sqlalchemy import create_engine, inspect, text
from app.config import DATABASE_URL

engine = create_engine(DATABASE_URL)
inspector = inspect(engine)

with engine.begin() as conn:
    cols = {c['name'] for c in inspector.get_columns('project')}
    if 'md_notes' not in cols:
        conn.execute(text(\"ALTER TABLE project ADD COLUMN md_notes TEXT NOT NULL DEFAULT ''\"))
        print('Added md_notes to project')
    else:
        print('md_notes already exists')

    if 'projecttodo' not in inspector.get_table_names():
        conn.execute(text('''
            CREATE TABLE projecttodo (
                id SERIAL PRIMARY KEY,
                project_id INTEGER NOT NULL,
                content TEXT NOT NULL,
                is_done BOOLEAN NOT NULL DEFAULT false,
                created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                updated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                CONSTRAINT fk_projecttodo_project FOREIGN KEY (project_id) REFERENCES project(id)
            )
        '''))
        conn.execute(text('CREATE INDEX ix_projecttodo_project_id ON projecttodo (project_id)'))
        print('Created projecttodo table')
    else:
        print('projecttodo already exists')

    if 'alembic_version' not in inspector.get_table_names():
        conn.execute(text('CREATE TABLE alembic_version (version_num VARCHAR(32) NOT NULL PRIMARY KEY)'))
        print('Created alembic_version table')
        conn.execute(text(\"INSERT INTO alembic_version (version_num) VALUES ('002_v1_2')\"))
        print('Stamped alembic_version to 002_v1_2')
    else:
        versions = [r[0] for r in conn.execute(text('SELECT version_num FROM alembic_version')).fetchall()]
        print('Current alembic versions:', versions)
"

            # 运行 Alembic 迁移（如果还有未执行的）
            alembic upgrade head || true
            
            # 重启 PM2 服务
            pm2 reload ariaai-backend --update-env
            
            # 复制前端构建文件到 Nginx 目录
            rm -rf /www/wwwroot/aria.d2cgo.co/*
            cp -r /www/wwwroot/AriaAI/aria-web/dist/* /www/wwwroot/aria.d2cgo.co/
            
            # 重启 Nginx
            nginx -t && nginx -s reload
            
            echo "部署完成!"
            
      - name: Notify Success
        if: success()
        run: echo "✅ 部署成功!"
        
      - name: Notify Failure
        if: failure()
        run: echo "❌ 部署失败!"
