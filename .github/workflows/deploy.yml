name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch: # Support manual runs

concurrency:
  # Shared with production DB E2E and restore workflows so migrations,
  # restarts, isolated tests, and restores can never overlap.
  group: production-database-maintenance
  # Never terminate a deployment after it may have started backup, migration,
  # or process replacement. New pushes wait for the active release to finish.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Build Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Frontend Tests
        run: |
          cd web
          # Bound worker fan-out so the full UI suite remains stable on
          # smaller GitHub runners while preserving test isolation.
          npm test -- --run --maxWorkers=2

      - name: Frontend Lint
        run: |
          cd web
          npm run lint -- --max-warnings=54

      - name: Prepare Backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          python -m pip install --retries 5 --timeout 60 -r requirements.txt || \
          python -m pip install --no-cache-dir --retries 5 --timeout 60 -r requirements.txt

      # The deployment server runs pure/unit checks plus read-only database
      # governance checks below. Database-mutating E2E tests belong to the
      # separate Production Database E2E workflow and use an isolated schema.

      - name: Backend Smoke Check
        run: |
          cd backend
          python -m py_compile main.py
          python -m py_compile app/config.py
          python -m py_compile app/models/db.py

      # This contract inspects the workflow file itself, so it must run in the
      # clean GitHub checkout rather than on the application-only server copy.
      - name: Deployment Workflow Contract
        run: |
          cd backend
          python tests/test_deployment_workflow_contract.py

      - name: Skill Quality Gate
        run: |
          cd backend
          python scripts/skill_quality_report.py --strict
          python - <<'PY'
          import json
          from pathlib import Path

          skills_root = Path("../skills").resolve()
          packages = sorted(
              path.parent.name
              for path in skills_root.glob("*/SKILL.md")
              if path.is_file()
          )
          manifest = {
              "schema_version": 1,
              "package_count": len(packages),
              "packages": packages,
          }
          (skills_root / ".aria-release-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Skill release manifest generated: packages={len(packages)}")
          PY

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          source: "web/dist/,backend/,skills/"
          target: "/www/wwwroot/AriaAI/"
          strip_components: 0
          overwrite: true

      - name: Execute Remote Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          # The focused server release suite currently takes about ten minutes.
          # Keep enough headroom for dependency downloads, the quality gate,
          # verified backup, migration governance, and the health check.
          command_timeout: 25m
          script: |
            set -e
            PROJECT_DIR="/www/wwwroot/AriaAI"
            BACKEND_DIR="$PROJECT_DIR/backend"
            LEGACY_BACKEND_DIR="$PROJECT_DIR/AriaAI/backend"

            # One-time compatibility move after repository directory normalization.
            if [ -d "$LEGACY_BACKEND_DIR" ]; then
              [ -d "$BACKEND_DIR/.venv" ] || [ ! -d "$LEGACY_BACKEND_DIR/.venv" ] || mv "$LEGACY_BACKEND_DIR/.venv" "$BACKEND_DIR/.venv"
              [ -f "$BACKEND_DIR/.env" ] || [ ! -f "$LEGACY_BACKEND_DIR/.env" ] || cp "$LEGACY_BACKEND_DIR/.env" "$BACKEND_DIR/.env"
              if [ -d "$LEGACY_BACKEND_DIR/data" ]; then
                mkdir -p "$BACKEND_DIR/data"
                cp -a "$LEGACY_BACKEND_DIR/data/." "$BACKEND_DIR/data/"
              fi
            fi

            cd "$BACKEND_DIR"

            # Activate the backend virtual environment.
            if [ ! -d ".venv" ]; then
              python3 -m venv .venv
            fi
            PYTHON=".venv/bin/python3"
            if [ ! -x "$PYTHON" ]; then
              PYTHON=".venv/bin/python"
            fi
            if [ ! -x "$PYTHON" ]; then
              echo "No Python interpreter found in backend virtual environment." >&2
              exit 127
            fi
            [ -x ".venv/bin/python" ] || ln -s "$(basename "$PYTHON")" .venv/bin/python
            source .venv/bin/activate

            # Install backend dependencies in case requirements changed.
            "$PYTHON" -m pip install --retries 5 --timeout 60 -r requirements.txt || \
            "$PYTHON" -m pip install --no-cache-dir --retries 5 --timeout 60 -r requirements.txt
            "$PYTHON" -m pip install --retries 5 --timeout 60 -r requirements-test.txt || \
            "$PYTHON" -m pip install --no-cache-dir --retries 5 --timeout 60 -r requirements-test.txt

            # Keep the deployed file-backed Skill root identical to the clean
            # GitHub checkout. Unexpected package directories are moved to a
            # recoverable archive, never irreversibly deleted.
            export PROJECT_DIR
            "$PYTHON" - <<'PY'
            import json
            import os
            import shutil
            from datetime import datetime, timezone
            from pathlib import Path

            skills_root = (Path(os.environ["PROJECT_DIR"]) / "skills").resolve()
            manifest_path = skills_root / ".aria-release-manifest.json"
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
            expected = {
                str(name)
                for name in manifest.get("packages", [])
                if isinstance(name, str) and name and "/" not in name and name not in {".", ".."}
            }
            if int(manifest.get("package_count", -1)) != len(expected) or not expected:
                raise SystemExit("Invalid or empty Skill release manifest")

            deployed = {
                path.name
                for path in skills_root.iterdir()
                if path.is_dir() and not path.is_symlink() and (path / "SKILL.md").is_file()
            }
            stale = sorted(deployed - expected)
            archive_path = None
            if stale:
                timestamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
                archive_path = Path("/www/backups/ariaai/stale-skills") / timestamp
                archive_path.mkdir(parents=True, exist_ok=False)
                for package_name in stale:
                    shutil.move(
                        str(skills_root / package_name),
                        str(archive_path / package_name),
                    )
            missing = sorted(
                name for name in expected if not (skills_root / name / "SKILL.md").is_file()
            )
            if missing:
                raise SystemExit(f"Missing deployed Skill packages: {missing}")
            print(
                "Skill deployment manifest verified: "
                f"expected={len(expected)}, archived={stale}, archive_path={archive_path}"
            )
            PY

            # Verify the configured server database without mutating application
            # data. Database-mutating integration tests are intentionally not run
            # against production; migration governance below owns schema changes.
            "$PYTHON" - <<'PY'
            from sqlalchemy import create_engine, text
            from app.config import DATABASE_URL

            engine = create_engine(DATABASE_URL)
            try:
                with engine.connect() as connection:
                    database_name, schema_name, database_user = connection.execute(
                        text("SELECT current_database(), current_schema(), current_user")
                    ).one()
                print(
                    "Remote PostgreSQL verified: "
                    f"database={database_name}, schema={schema_name}, user={database_user}"
                )
            finally:
                engine.dispose()
            PY

            # Run the focused harness suite. Behavioral tests use pure unit or
            # isolated SQLite fixtures; database governance/health checks are
            # read-only against the configured server database.
            TEST_DATABASE_PATH="/tmp/ariaai_deploy_tests_${{ github.run_id }}_${{ github.run_attempt }}.sqlite"
            export TEST_DATABASE_URL="sqlite:///$TEST_DATABASE_PATH"
            trap 'rm -f "$TEST_DATABASE_PATH" "$TEST_DATABASE_PATH-shm" "$TEST_DATABASE_PATH-wal"' EXIT
            "$PYTHON" -m pytest -q \
                tests/test_agent_harness_native.py \
                tests/test_artifact_verification.py \
                tests/test_artifact_verification_migration.py \
                tests/test_artifact_acceptance.py \
                tests/test_artifact_acceptance_migration.py \
                tests/test_generated_file_deliverable_migration.py \
                tests/test_artifact_knowledge_archive_migration.py \
                tests/test_active_chat_run_lease.py \
                tests/test_active_chat_run_lease_migration.py \
                tests/test_agent_loop_durable_boundaries.py \
                tests/test_activity_timeline_persist.py \
                tests/test_approval_envelope.py \
                tests/test_context_assembly_manifest.py \
                tests/test_context_receipt.py \
                tests/test_chat_runtime_configuration.py \
                tests/test_conversation_capsule.py \
                tests/test_conversation_continuity.py \
                tests/test_conversation_continuity_postgres.py \
                tests/test_project_question_resolutions.py \
                tests/test_project_question_resolution_migration.py \
                tests/test_project_question_workbench.py \
                tests/test_project_question_evidence.py \
                tests/test_project_question_reanswer.py \
                tests/test_project_question_remediation.py \
                tests/test_project_question_remediation_promotions.py \
                tests/test_project_question_remediation_promotion_migration.py \
                tests/test_project_question_remediation_executions.py \
                tests/test_project_question_remediation_execution_migration.py \
                tests/test_project_question_workbench_migration.py \
                tests/test_project_question_resolutions_postgres.py \
                tests/test_database_extended.py \
                tests/test_grounded_provider_eval.py \
                tests/test_instruction_manifest.py \
                tests/test_knowledge_evidence.py \
                tests/test_knowledge_job_acl.py \
                tests/test_knowledge_job_recovery.py \
                tests/test_knowledge_storage_atomicity.py \
                tests/test_knowledge_legacy_migration.py \
                tests/test_layered_memory_routing.py \
                tests/test_memory_fact_source_trust.py \
                tests/test_memory_failure_recovery.py \
                tests/test_memory_source_attributions.py \
                tests/test_memory_source_fingerprints.py \
                tests/test_memory_slots.py \
                tests/test_product_run_events.py \
                tests/test_project_chat_quality_eval.py \
                tests/test_project_memory_evidence.py \
                tests/test_run_evaluation.py \
                tests/test_run_output_record.py \
                tests/test_run_effect_record.py \
                tests/test_run_rollout.py \
                tests/test_tool_executor_recovery.py \
                tests/test_chat_run_persistence.py \
                tests/test_chat_run_projection.py \
                tests/test_durable_run_inputs.py \
                tests/test_durable_run_recovery_migration.py \
                tests/test_client_memory_acl.py \
                tests/test_client_memory_jobs.py \
                tests/test_clients_router.py::ClientAuthorizationTestCase::test_single_project_editor_cannot_rename_or_delete_shared_client \
                tests/test_clients_router.py::ClientAuthorizationTestCase::test_editor_of_every_linked_project_can_rename_and_delete_client \
                tests/test_clients_router.py::ClientAuthorizationTestCase::test_client_views_do_not_expose_other_linked_projects_or_documents \
                tests/test_knowledge_write_permissions.py \
                tests/test_memory_candidates.py \
                tests/test_project_client_identity.py \
                tests/test_project_client_identity_migration.py \
                tests/test_project_memory_acl.py \
                tests/test_project_stakeholder_acl.py \
                tests/test_project_subroute_write_acl.py \
                tests/test_route_registration.py \
                tests/test_task_orchestrator.py \
                tests/test_office_documents_tool.py \
                tests/test_hitas_project_write_final_auth.py \
                tests/test_hitas_project_scope_binding.py \
                tests/test_skill_root_snapshots.py \
                tests/test_skill_quality.py \
                tests/test_skill_deliverables.py \
                tests/test_skill_runtime_contract.py \
                tests/test_structured_patch.py \
                tests/test_tool_capability_manifest.py \
                tests/test_tool_execution_record.py \
                tests/test_tool_transcript.py \
                tests/test_tool_parallelism.py \
                tests/test_turn_interrupt.py \
                tests/test_turn_steering.py \
                tests/test_turn_recovery.py \
                tests/test_turn_budget.py \
                tests/test_turn_retry.py \
                tests/test_user_memory_prompt.py::FormatUserMemoryTest \
                tests/test_verified_postgres_backup.py \
                tests/test_chat_actions.py \
                tests/test_chat_async_recovery.py \
                tests/test_chat_continuity_feedback.py \
                tests/test_chat_end_to_end.py \
                tests/test_chat_flow.py::ChatStreamingServiceTestCase::test_stream_chat_events_persists_friendly_phase_errors \
                tests/test_sse_events.py \
                tests/test_chat_multiturn_golden.py

            # Emit deterministic project-chat quality metrics as a release
            # gate. This uses ephemeral SQLite only and never touches the
            # configured production database.
            "$PYTHON" scripts/project_chat_quality_eval.py

            # A verified, custom-format backup is a hard precondition for any
            # production migration. The helper selects a client compatible with
            # the server, validates the archive with pg_restore, and prints its
            # SHA-256 without exposing database credentials.
            BACKUP_DIR="/www/backups/ariaai"
            RUN_TAG="${{ github.run_id }}_${{ github.run_attempt }}"
            mkdir -p "$BACKUP_DIR"
            chmod 700 "$BACKUP_DIR"
            BACKUP_PATH="$BACKUP_DIR/ariaai_pre_deploy_$(date -u +%Y%m%dT%H%M%SZ)_${RUN_TAG}.dump"
            export BACKUP_PATH
            "$PYTHON" scripts/verified_postgres_backup.py

            # Govern historical migration state before applying the latest schema.
            "$PYTHON" scripts/migration_governance.py report
            "$PYTHON" scripts/migration_governance.py ensure
            "$PYTHON" scripts/migration_governance.py upgrade
            "$PYTHON" scripts/migration_governance.py check

            # Audit the remaining aggregate-JSON read dependency after the
            # verified backup. The report uses an explicit read-only
            # transaction and never exposes memory content.
            "$PYTHON" scripts/memory_read_authority_report.py

            # Reload backend after code and schema changes.
            mkdir -p /www/wwwroot/AriaAI/logs
            pm2 delete ariaai-backend >/dev/null 2>&1 || true
            pm2 start ecosystem.config.js --update-env
            pm2 save

            # Verify the backend is actually serving before publishing success.
            backend_ready=0
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
                backend_ready=1
                break
              fi
              sleep 2
            done
            if [ "$backend_ready" != "1" ]; then
              echo "Backend health check failed after PM2 restart." >&2
              pm2 status || true
              pm2 describe ariaai-backend || true
              echo "---- backend error log ----" >&2
              tail -n 160 /www/wwwroot/AriaAI/logs/backend-error.log || true
              echo "---- backend out log ----" >&2
              tail -n 120 /www/wwwroot/AriaAI/logs/backend-out.log || true
              exit 1
            fi

            # Replace frontend build artifacts served by Nginx.
            rm -rf /www/wwwroot/aria.d2cgo.co/*
            cp -r /www/wwwroot/AriaAI/web/dist/* /www/wwwroot/aria.d2cgo.co/

            # Reload Nginx only after the config validates.
            nginx -t && nginx -s reload

            echo "Deployment completed successfully."

      - name: Notify Success
        if: success()
        run: echo "Deployment succeeded."

      - name: Notify Failure
        if: failure()
        run: echo "Deployment failed."
