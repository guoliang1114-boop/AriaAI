name: Auto Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        # 或者用密钥: key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /www/wwwroot/AriaAI
          git pull origin main
          
          # 部署后端
          cd AriaAI/backend
          source .venv/bin/activate
          pip install -r requirements.txt -q
          
          # 数据库迁移（如果有）
          # alembic upgrade head
          
          # 重启后端
          pm2 restart ariaai-backend || pm2 start "uvicorn main:app --host 127.0.0.1 --port 8000" --name ariaai-backend --interpreter ./.venv/bin/python
          
          # 部署前端
          cd ../../aria-web
          npm install
          npm run build
          
          # 复制到网站目录
          cp -r dist/* /www/wwwroot/${{ secrets.DOMAIN }}/
          
          echo "部署完成！"
