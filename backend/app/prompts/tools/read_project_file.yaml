name: read_project_file
purpose: List or read files in the current project space, including PDF, DOCX, PPTX, XLSX, Markdown, text, CSV, and JSON.
when_to_use: Use action=list to discover files; use action=read to extract text from a specific existing file for analysis.
when_not_to_use: Do not use this to create, move, delete, or modify files. Do not read arbitrary files outside the current project.
ui_effect: Reading may be shown as project-file inspection progress in chat.
