cases:
  - id: direct_project_memory_summary
    content: "请基于当前项目的结构化记忆，给我一个 5 条以内的项目概览摘要，覆盖当前阶段、关键进展、风险和下一步动作。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - read_project_markdown_document
      - update_project_markdown_document

  - id: project_risk_analysis_direct_answer
    content: "请基于当前项目的结构化记忆，识别最重要的项目风险和阻塞点，并给出建议的缓解动作。"
    project_id: 26
    expected_chat_mode: project_deep_dive
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - read_project_markdown_document
      - update_project_markdown_document

  - id: project_risk_question_read_only_no_write
    content: "这个项目的风险是什么？"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: read_only_tool
    expected_tool_access_policy: read_on_demand
    expected_contract_action: read_then_answer
    forbid_tools:
      - name: update_project_markdown_document
        input:
          mode: create
          content: "# 风险分析"

  - id: project_milestone_progress_analysis_direct_answer
    content: "请基于当前项目的结构化记忆，分析当前里程碑推进情况，指出已经完成的进展、可能延迟的事项，以及接下来最需要推进的里程碑。"
    project_id: 26
    expected_chat_mode: project_deep_dive
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - read_project_markdown_document
      - update_project_markdown_document

  - id: project_milestone_progress_analysis_with_quoted_ai_advice
    content: "请基于当前项目的结构化记忆，分析当前里程碑推进情况，指出已经完成的进展、可能延迟的事项，以及接下来最需要推进的里程碑。以下是别的 AI 给出的建议，当然你要辩证地看：模型还在调 MD 工具，可能是 prompt 里有生成文档的暗示；建议生成一份推进计划。"
    project_id: 26
    expected_chat_mode: project_deep_dive
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - read_project_markdown_document
      - update_project_markdown_document

  - id: explicit_markdown_artifact
    content: "请生成一个 md 文档，整理项目风险清单，并保存到项目空间。"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true
    allow_tools:
      - update_project_markdown_document

  - id: standalone_chat
    content: "你是谁？"
    project_id: null
    expected_chat_mode: standalone_qa
    expected_action_policy: direct_answer
    expected_tool_access_policy: none
    expected_contract_action: answer_only
    forbid_tools:
      - update_project_markdown_document

  - id: workspace_inventory
    content: "帮我看一下现在全部项目的情况和风险。"
    project_id: null
    expected_chat_mode: workspace_inventory
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - update_project_markdown_document

  - id: portfolio_cross_session_context
    content: "继续看这个客户的所有项目，帮我总结风险和下一步动作。"
    project_id: 26
    expected_chat_mode: cross_project_portfolio
    expected_action_policy: direct_answer
    expected_tool_access_policy: injected_context_only
    expected_contract_action: answer_only
    forbid_tools:
      - update_project_markdown_document

  - id: modify_existing_file_requires_modify_policy
    content: "请把刚才的会议准备文档更新一下，追加会后行动清单。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: modify_existing_file
    expected_tool_access_policy: write_allowed
    expected_contract_action: modify_project_space
    expected_write_allowed: true
    allow_tools:
      - name: update_project_markdown_document
        input:
          mode: append
          content: "## 会后行动清单\n- 跟进材料"

  - id: destructive_action_requires_destructive_policy
    content: "删除这个项目的旧对话记录。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: destructive_action
    expected_tool_access_policy: write_allowed
    expected_contract_action: destructive_action
    expected_write_allowed: true
    allow_tools:
      - name: manage_project_folders
        input:
          action: delete

  - id: project_space_organization_requires_modify_policy
    content: "请对项目空间里面的文件进行归类整理。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: modify_existing_file
    expected_tool_access_policy: write_allowed
    expected_contract_action: modify_project_space
    expected_write_allowed: true
    allow_tools:
      - name: manage_project_folders
        input:
          action: move_file
          file_id: 131
          folder_id: 5

  - id: explicit_skill_execution
    content: "用这个 Skill 帮我生成客户会议准备材料，并保存到项目空间。"
    project_id: 27
    skill_id: 3
    force_skill: true
    expected_chat_mode: skill_execution
    expected_action_policy: write_artifact
    expected_tool_access_policy: write_allowed
    expected_contract_action: run_skill
    expected_write_allowed: true
    allow_tools:
      - update_project_markdown_document

  - id: office_generation_enters_task_orchestration
    content: "给我准备一个客户介绍 PPT，保存到项目空间。"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true

  - id: ppt_version_request_enters_task_orchestration
    content: "给我一个客户沟通的初步方案 ppt版本"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true

  - id: save_previous_answer_markdown_followup
    content: "要，保存成 Markdown"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: write_artifact
    expected_tool_access_policy: write_allowed
    expected_contract_action: save_previous_answer
    expected_write_allowed: true
    expected_delivery_required: true

  - id: save_previous_risk_analysis_markdown_followup
    content: "把刚才的风险分析保存为 md"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: write_artifact
    expected_tool_access_policy: write_allowed
    expected_contract_action: save_previous_answer
    expected_write_allowed: true
    expected_delivery_required: true

  - id: explicit_file_read_request
    content: "读取项目空间里的客户会议准备.md，并告诉我里面有哪些待办。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: read_only_tool
    expected_tool_access_policy: explicit_file_read
    expected_contract_action: read_then_answer
    allow_tools:
      - name: read_project_markdown_document
        input:
          action: read
          file_name: "客户会议准备.md"
    forbid_tools:
      - update_project_markdown_document

  - id: general_advice_no_file
    content: "帮我分析一下明天客户访谈应该重点问什么。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: read_only_tool
    expected_tool_access_policy: read_on_demand
    expected_contract_action: read_then_answer
    forbid_tools:
      - update_project_markdown_document

  - id: inline_markdown_generation_not_previous_save
    content: "请根据以下内容生成 Markdown 报告：客户希望了解项目风险和下一步。"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true

  - id: append_existing_markdown_requires_modify
    content: "把这段会后行动清单追加到现有 Markdown 文档里。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: modify_existing_file
    expected_tool_access_policy: write_allowed
    expected_contract_action: modify_project_space
    expected_write_allowed: true
    allow_tools:
      - name: update_project_markdown_document
        input:
          mode: append
          content: "- 会后行动"

  - id: replace_existing_markdown_requires_modify
    content: "用新版内容覆盖当前项目风险 Markdown 文档。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: modify_existing_file
    expected_tool_access_policy: write_allowed
    expected_contract_action: modify_project_space
    expected_write_allowed: true
    allow_tools:
      - name: update_project_markdown_document
        input:
          mode: replace
          content: "# 新版风险"

  - id: create_excel_artifact
    content: "帮我生成一个 Excel 项目风险台账，保存到项目空间。"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true

  - id: create_pdf_artifact
    content: "请生成一份 PDF 风险简报，保存到项目空间。"
    project_id: 27
    expected_chat_mode: task_orchestration
    expected_action_policy: durable_task
    expected_tool_access_policy: write_allowed
    expected_contract_action: create_artifact
    expected_write_allowed: true
    expected_delivery_required: true

  - id: no_destructive_from_negative_question
    content: "是不是不要删除这些项目文件？"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: read_only_tool
    expected_tool_access_policy: read_on_demand
    expected_contract_action: read_then_answer
    forbid_tools:
      - name: manage_project_files
        input:
          action: delete

  - id: rename_project_folder_requires_modify
    content: "把项目空间里的旧资料文件夹重命名为历史资料。"
    project_id: 27
    expected_chat_mode: project_deep_dive
    expected_action_policy: modify_existing_file
    expected_tool_access_policy: write_allowed
    expected_contract_action: modify_project_space
    expected_write_allowed: true
    allow_tools:
      - name: manage_project_folders
        input:
          action: rename
          folder_name: "旧资料"
          new_name: "历史资料"
